name: Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  improve-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "ObsidianQuickLaunch"
      project_context: "ObsidianQuickLaunch is a Windows utility that puts Obsidian vault shortcuts in the right-click context menu in File Explorer. Its audience is everyday Obsidian users — not developers — who want to open or create a vault without launching Obsidian first. Write changes in terms of how vault access becomes faster or more reliable."
      header: |
        ## ObsidianQuickLaunch

        > Open or create Obsidian vaults from the Windows right-click context menu.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/ObsidianQuickLaunch/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/ScottKirvan/ObsidianQuickLaunch/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/ObsidianQuickLaunch/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/ObsidianQuickLaunch/blob/main/notes/CHANGELOG.md)

        ---
      footer: ""
      changelog_path: ""
    secrets: inherit

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, improve-release-notes]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "ObsidianQuickLaunch"
      emoji: "📂"
      discord_blurb: ${{ needs.improve-release-notes.outputs.discord_blurb }}
    secrets: inherit
